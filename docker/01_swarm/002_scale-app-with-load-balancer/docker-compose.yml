version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - webnet
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    image: myapp:latest
    networks:
      - webnet
    expose:
      - "80"
    deploy:
      replicas: 5
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

networks:
  webnet:
    driver: overlay